<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Headbangers Rock´n Roll</title>
<style>
:root {
  --red: #ef2727;
  --dark-red: #7c0909;
  --orange: #ff8a18;
  --yellow: #ffe04b;
  --cyan: #20e7e7;
  --pink: #ff45ad;
  --green: #44ef9a;
  --cream: #fff4d6;
  --chrome-1: #f8fbff;
  --chrome-2: #a9b1b8;
  --chrome-3: #444a50;
  --black: #080808;
}

* { box-sizing: border-box; }

html, body { min-height: 100%; }

body {
  margin: 0;
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  color: var(--cream);
  font-family: "Trebuchet MS", "Arial Narrow", Arial, sans-serif;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,0,119,.17), transparent 24%),
    radial-gradient(circle at 85% 30%, rgba(0,225,255,.14), transparent 25%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 8px),
    radial-gradient(ellipse at center, #292929 0%, #090909 58%, #000 100%);
}

.jukebox {
  position: relative;
  width: min(560px, 96vw);
  padding: 25px;
  border-radius: 255px 255px 38px 38px / 205px 205px 38px 38px;
  background:
    linear-gradient(90deg, transparent 0 4%, rgba(255,255,255,.7) 7%, transparent 12% 88%, rgba(255,255,255,.55) 93%, transparent 97%),
    linear-gradient(180deg, var(--chrome-1) 0%, #7d858c 9%, #e6ebef 14%, #555c61 21%, #c7cdd2 31%, #4a5055 100%);
  border: 4px solid #25292c;
  box-shadow:
    0 0 0 4px #d4d8dc,
    0 0 0 8px #34393d,
    0 25px 70px rgba(0,0,0,.85),
    0 0 60px rgba(255,45,45,.34);
}

.jukebox::before,
.jukebox::after {
  content: "";
  position: absolute;
  top: 125px;
  bottom: 85px;
  width: 13px;
  border-radius: 10px;
  background: linear-gradient(#e8302a, #ffcf38, #19e7e7, #ff45ad, #e8302a);
  background-size: 100% 300%;
  animation: tubeFlow 3s linear infinite;
  box-shadow: 0 0 8px white, 0 0 17px currentColor;
  z-index: 4;
}
.jukebox::before { left: 12px; }
.jukebox::after { right: 12px; animation-direction: reverse; }

.inner {
  position: relative;
  overflow: hidden;
  min-height: 700px;
  padding: 34px 45px 28px;
  border: 6px solid var(--dark-red);
  border-radius: 225px 225px 22px 22px / 180px 180px 22px 22px;
  background:
    radial-gradient(ellipse at 50% 17%, rgba(255,210,55,.11), transparent 27%),
    linear-gradient(180deg, #20110c 0%, #090807 38%, #12100f 100%);
  box-shadow:
    inset 0 0 55px #000,
    0 0 0 5px #f0f3f5,
    0 0 26px rgba(255,41,41,.65);
}

.neon-arch {
  pointer-events: none;
  position: absolute;
  inset: 15px;
  border: 8px solid var(--red);
  border-bottom-color: var(--orange);
  border-radius: 205px 205px 16px 16px / 165px 165px 16px 16px;
  box-shadow:
    0 0 5px white,
    0 0 12px var(--red),
    0 0 28px var(--red),
    inset 0 0 14px var(--red);
  animation: neonPulse 2.2s ease-in-out infinite alternate;
}

.content { position: relative; z-index: 2; }

.record-area {
  height: 170px;
  display: grid;
  place-items: center;
  margin-top: 8px;
}

.record {
  position: relative;
  width: 148px;
  height: 148px;
  border-radius: 50%;
  background:
    repeating-radial-gradient(circle, transparent 0 4px, rgba(255,255,255,.08) 5px, transparent 6px 9px),
    conic-gradient(from 20deg, #050505, #343434, #050505, #232323, #050505);
  border: 3px solid #171717;
  box-shadow: 0 0 0 4px #777, 0 8px 20px #000, 0 0 24px rgba(255,224,75,.25);
}

.record.spin { animation: spin 1.45s linear infinite; }

.record-label {
  position: absolute;
  inset: 48px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #161616;
  background: radial-gradient(circle, #171717 0 5px, var(--yellow) 6px 100%);
  font-size: 10px;
  font-weight: 900;
  text-align: center;
  line-height: 1;
  transform: rotate(-12deg);
}

.tonearm {
  position: absolute;
  width: 90px;
  height: 12px;
  top: 34px;
  left: calc(50% + 45px);
  transform: rotate(43deg);
  transform-origin: left center;
  border-radius: 10px;
  background: linear-gradient(#f8f8f8, #62676b 55%, #222);
  box-shadow: 0 2px 4px #000;
}
.tonearm::before {
  content: "";
  position: absolute;
  left: -10px;
  top: -7px;
  width: 25px;
  height: 25px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, #777 55%, #222);
}
.tonearm::after {
  content: "";
  position: absolute;
  right: -6px;
  top: -4px;
  width: 20px;
  height: 20px;
  border-radius: 2px 8px 8px 2px;
  background: var(--red);
}

.brand {
  margin: 2px 0 18px;
  text-align: center;
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  font-size: clamp(28px, 7vw, 45px);
  line-height: .95;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--yellow);
  transform: rotate(-1deg);
  text-shadow:
    0 0 3px #fff,
    0 0 8px var(--orange),
    0 0 20px var(--red),
    3px 4px 0 #6e0808,
    6px 7px 0 #050505;
}

.for-christian {
  margin: 0 0 15px;
  text-align: center;
  color: var(--cyan);
  font-weight: bold;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-shadow: 0 0 7px var(--cyan), 0 0 17px var(--cyan);
}

.display {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 10px;
  border: 4px solid #e8edf0;
  border-radius: 12px;
  background: #020505;
  box-shadow: inset 0 0 20px #000, 0 0 17px rgba(32,231,231,.38);
}

.slot {
  width: 44px;
  height: 51px;
  display: grid;
  place-items: center;
  border: 1px solid var(--cyan);
  border-radius: 5px;
  background: #000;
  color: var(--cyan);
  font-family: "Courier New", monospace;
  font-size: 34px;
  font-weight: bold;
  text-shadow: 0 0 8px var(--cyan), 0 0 18px var(--cyan);
}

.display.success .slot {
  color: var(--green);
  border-color: var(--green);
  text-shadow: 0 0 8px var(--green), 0 0 20px var(--green);
}
.display.error { animation: shake .38s ease; }
.display.error .slot {
  color: var(--red);
  border-color: var(--red);
  text-shadow: 0 0 8px var(--red), 0 0 20px var(--red);
}

.message {
  min-height: 40px;
  display: grid;
  place-items: center;
  margin-bottom: 12px;
  padding: 6px;
  text-align: center;
  color: var(--cream);
  font-size: 14px;
  letter-spacing: 1px;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

.key {
  aspect-ratio: 1;
  border: 2px solid rgba(255,255,255,.7);
  border-radius: 50%;
  color: #151515;
  font: 900 20px inherit;
  cursor: pointer;
  box-shadow: 0 5px 0 rgba(0,0,0,.55), 0 7px 12px #000, inset 0 3px 4px rgba(255,255,255,.7);
  transition: transform .08s ease, filter .08s ease;
}
.key:nth-child(5n+1) { background: radial-gradient(circle at 35% 28%, #ffad91, var(--red) 66%); }
.key:nth-child(5n+2) { background: radial-gradient(circle at 35% 28%, #ffd09b, var(--orange) 66%); }
.key:nth-child(5n+3) { background: radial-gradient(circle at 35% 28%, #fff3ad, var(--yellow) 66%); }
.key:nth-child(5n+4) { background: radial-gradient(circle at 35% 28%, #b0ffff, var(--cyan) 66%); }
.key:nth-child(5n+5) { background: radial-gradient(circle at 35% 28%, #ffb0d8, var(--pink) 66%); }
.key:hover { filter: brightness(1.18); }
.key:active { transform: translateY(4px); box-shadow: 0 1px 0 #000, 0 3px 5px #000, inset 0 2px 3px rgba(255,255,255,.6); }

.clear {
  width: 100%;
  margin-top: 16px;
  padding: 12px;
  border: 2px solid #dfe5e9;
  border-radius: 9px;
  color: var(--cream);
  background: linear-gradient(#414141, #0c0c0c);
  font: 800 14px inherit;
  letter-spacing: 2px;
  cursor: pointer;
}
.clear:hover { background: linear-gradient(#575757, #171717); }

.player-box {
  display: none;
  margin-top: 16px;
  padding: 12px;
  border: 3px solid #dce2e6;
  border-radius: 12px;
  background: #090909;
  box-shadow: 0 0 18px rgba(255,69,173,.42);
}
.player-box.visible { display: block; }
audio { display: block; width: 100%; }

.retirement {
  margin: 15px 0 0;
  text-align: center;
  color: #e7e7e7;
  font-size: 12px;
  letter-spacing: 1.5px;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes tubeFlow { to { background-position: 0 100%; } }
@keyframes neonPulse {
  from { filter: brightness(.82); opacity: .85; }
  to { filter: brightness(1.25); opacity: 1; }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

@media (max-width: 520px) {
  body { padding: 12px; }
  .jukebox { padding: 17px; }
  .inner { min-height: 650px; padding: 28px 31px 23px; }
  .record-area { height: 145px; }
  .record { width: 125px; height: 125px; }
  .record-label { inset: 40px; }
  .tonearm { top: 28px; left: calc(50% + 37px); width: 76px; }
  .brand { font-size: 31px; }
  .keypad { gap: 7px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>

<main class="jukebox" aria-label="Jukebox für Christians Rentenabschied">
  <section class="inner">
    <div class="neon-arch" aria-hidden="true"></div>

    <div class="content">
      <div class="record-area" aria-hidden="true">
        <div class="record" id="record">
          <div class="record-label">ROCK<br>49</div>
        </div>
        <div class="tonearm"></div>
      </div>

      <h1 class="brand">Headbangers<br>Rock´n Roll</h1>
      <p class="for-christian">Für Christian</p>

      <div class="display" id="display" aria-label="Gewählte Nummer">
        <div class="slot" id="slot0">&nbsp;</div>
        <div class="slot" id="slot1">&nbsp;</div>
      </div>

      <div class="message" id="message" aria-live="polite">Wähle deine Nummer</div>

      <div class="keypad" id="keypad" aria-label="Zahlentastatur"></div>

      <button class="clear" id="clearBtn" type="button">LÖSCHEN</button>

      <div class="player-box" id="playerBox">
        <audio id="audioPlayer" controls preload="metadata">
          <source src="motorhead.mp3" type="audio/mpeg">
          Dein Browser kann diese MP3-Datei nicht abspielen.
        </audio>
      </div>

      <p class="retirement">Christian geht in Rente. Der Rock bleibt.</p>
    </div>
  </section>
</main>

<script>
"use strict";

const CORRECT_CODE = "49";
let entered = "";
let resetTimer = null;
let audioContext = null;

const display = document.getElementById("display");
const slot0 = document.getElementById("slot0");
const slot1 = document.getElementById("slot1");
const message = document.getElementById("message");
const keypad = document.getElementById("keypad");
const clearBtn = document.getElementById("clearBtn");
const record = document.getElementById("record");
const playerBox = document.getElementById("playerBox");
const audioPlayer = document.getElementById("audioPlayer");

for (let number = 0; number <= 9; number += 1) {
  const button = document.createElement("button");
  button.className = "key";
  button.type = "button";
  button.textContent = String(number);
  button.setAttribute("aria-label", `Nummer ${number}`);
  button.addEventListener("click", () => pressDigit(String(number)));
  keypad.appendChild(button);
}

function updateSlots() {
  slot0.textContent = entered[0] || "\u00A0";
  slot1.textContent = entered[1] || "\u00A0";
}

function pressDigit(digit) {
  if (entered.length >= 2) return;
  display.classList.remove("error", "success");
  entered += digit;
  updateSlots();
  if (entered.length === 2) checkCode();
}

function checkCode() {
  if (entered === CORRECT_CODE) {
    display.classList.add("success");
    message.textContent = "Treffer! Headbangers Rock´n Roll für Christian!";
    playerBox.classList.add("visible");
    record.classList.add("spin");
    audioPlayer.currentTime = 0;

    audioPlayer.play().catch(() => {
      message.textContent = "Treffer! Drücke jetzt auf Play.";
    });
    return;
  }

  display.classList.add("error");
  message.textContent = "Falsche Nummer";
  playLostBeep();
  window.clearTimeout(resetTimer);
  resetTimer = window.setTimeout(resetSelection, 900);
}

function resetSelection() {
  entered = "";
  display.classList.remove("error", "success");
  updateSlots();
  message.textContent = "Wähle deine Nummer";
}

function resetAll() {
  window.clearTimeout(resetTimer);
  audioPlayer.pause();
  audioPlayer.currentTime = 0;
  playerBox.classList.remove("visible");
  record.classList.remove("spin");
  resetSelection();
}

function playLostBeep() {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;

  audioContext = audioContext || new AudioContextClass();
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const now = audioContext.currentTime;

  oscillator.type = "sawtooth";
  oscillator.frequency.setValueAtTime(440, now);
  oscillator.frequency.exponentialRampToValueAtTime(110, now + 0.55);
  gain.gain.setValueAtTime(0.14, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

  oscillator.connect(gain);
  gain.connect(audioContext.destination);
  oscillator.start(now);
  oscillator.stop(now + 0.6);
}

clearBtn.addEventListener("click", resetAll);
audioPlayer.addEventListener("play", () => record.classList.add("spin"));
audioPlayer.addEventListener("pause", () => record.classList.remove("spin"));
audioPlayer.addEventListener("ended", resetAll);

updateSlots();
</script>
</body>
</html>
